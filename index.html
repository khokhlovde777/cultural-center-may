<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>демо версия вёрстки</title>
    <style>
      :root {
        color-scheme: light;

        --color-red-900: #390101;
        --color-red-700: #5B0609;
        --color-red-500: #9B1B1B;
        --color-navy-900: #182F4E;
        --color-navy-700: #17304F;
        --color-neutral-white: #FFFFFF;
        --color-neutral-50: #F5F5F5;
        --color-neutral-100: #EAEAEA;
        --color-neutral-200: #D9D9D9;
        --color-neutral-300: #BEBEBE;
        --color-neutral-400: #929292;
        --color-neutral-500: #6E6255;
        --color-neutral-900: #241C16;
        --color-neutral-black: #000000;
        --color-tint-cream: #FEEDE9;
        --color-tint-purple: #E5C6FF;
        --color-tint-blue: #D4E4FF;
        --color-tint-mint: #C2F7B9;
        --color-blue-600: #0347BD;

        --brand-primary: var(--color-red-700);
        --brand-primary-dark: var(--color-red-900);
        --brand-accent: var(--color-red-500);
        --brand-secondary: var(--color-navy-700);
        --brand-secondary-dark: var(--color-navy-900);
        --text-primary: var(--color-neutral-900);
        --text-secondary: var(--color-neutral-500);
        --text-muted: var(--color-neutral-400);
        --text-inverse: var(--color-neutral-white);
        --bg-default: var(--color-neutral-white);
        --bg-subtle: var(--color-neutral-50);
        --bg-tint: var(--color-tint-cream);
        --border-default: var(--color-neutral-300);
        --border-subtle: var(--color-neutral-200);
        --link: var(--color-blue-600);
        --surface-dark: var(--color-color-navy-900);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: radial-gradient(900px 480px at 20% 0%, rgba(155, 27, 27, 0.06), transparent 65%),
          radial-gradient(760px 520px at 100% 20%, rgba(23, 48, 79, 0.06), transparent 60%),
          var(--bg-default);
        color: var(--text-primary);
        background-repeat: no-repeat;
      }

      a {
        color: inherit;
      }

      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 56px;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.02em;
        color: var(--brand-primary-dark);
      }

      .subtitle {
        margin: 0;
        color: var(--text-secondary);
      }

      .grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 14px 12px;
        border-radius: 14px;
        background: var(--color-neutral-50);
        border: 1px solid var(--border-default);
        text-decoration: none;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease,
          box-shadow 120ms ease;
      }

      .card:hover {
        transform: translateY(-1px);
        border-color: var(--brand-accent);
        background: var(--neutral-white);
        box-shadow: 0 6px 20px rgba(57, 1, 1, 0.08);
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .page-title {
        font-weight: 650;
        color: var(--brand-primary-dark);
      }

      .badge {
        flex: none;
        font-size: 12px;
        color: var(--brand-secondary);
        background: var(--bg-tint);
        border: 1px solid var(--border-default);
        border-radius: 999px;
        padding: 2px 10px;
      }

      .path {
        margin: 0;
        font-size: 13px;
        color: var(--text-muted);
        word-break: break-all;
      }

      .hint {
        margin-top: 18px;
        color: var(--text-muted);
        font-size: 13px;
      }

      .hint code {
        color: var(--brand-primary);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Демо версия вёрстки</h1>
        <p class="subtitle">Быстрые ссылки для открытия макетов/страниц.</p>
      </header>

      <main class="grid">
        
        <a class="card" href="html/main.html">
          <div class="title-row">
            <div class="page-title">Главная</div>
            <div class="badge">main</div>
          </div>
          <p class="path">html/main.html</p>
        </a>

      </main>
    </div>
  </body>
</html>
